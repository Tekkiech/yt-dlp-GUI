name: Build cross-platform binaries

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      should_release: ${{ steps.compute.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: compute
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            should_release=true
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            git fetch --tags --force
            mapfile -t tags < <(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V)
            if [ "${#tags[@]}" -eq 0 ]; then
              base="1.0.1"
            else
              base="${tags[-1]}"
            fi
            IFS='.' read -r major minor patch <<< "$base"
            version="v${major}.${minor}.$((patch + 1))"
            should_release=true
          else
            version="dev-${GITHUB_SHA:0:7}"
            should_release=false
          fi

          echo "Resolved version: ${version} (release: ${should_release})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

  build:
    name: Build binaries
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.x"

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Display environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Matrix GOOS: ${{ matrix.goos }}"
          echo "Matrix GOARCH: ${{ matrix.goarch }}"
          echo "Version: ${{ needs.version.outputs.version }}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          OUTPUT_NAME="yt-dlp-gui-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          echo "Building ${OUTPUT_NAME}..."
          env GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags "-s -w -X main.version=${{ needs.version.outputs.version }}" \
            -o "dist/${OUTPUT_NAME}" .
          echo "Built: dist/${OUTPUT_NAME}"
          ls -lh dist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist

  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    if: needs.version.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display release assets
        run: |
          ls -lh dist
          find dist -type f -maxdepth 2 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/**/*
